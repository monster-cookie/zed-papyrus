name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension, grammar, and queries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zed WebAssembly target
        run: rustup target add wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint extension and tests
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test extension, grammar, and queries
        run: cargo test --locked

      - name: Check Zed WebAssembly extension
        run: cargo check --locked --target wasm32-wasip2
