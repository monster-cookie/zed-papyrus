name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension and grammar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Validate extension structure
        run: npm run extension:test

      - name: Generate Tree-sitter parser
        run: npm run grammar:generate

      - name: Verify generated parser is committed
        run: git diff --exit-code -- grammar/src/grammar.json grammar/src/node-types.json grammar/src/parser.c

      - name: Build Tree-sitter WebAssembly grammar
        run: npm run grammar:build

      - name: Test fixtures and Zed queries
        run: npm run grammar:test

      - name: Test native Tree-sitter corpus
        run: npm run grammar:test:native
